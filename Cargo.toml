[workspace]
resolver = "2"
members = [
  "crates/honba-ya-api",
  "crates/honba-ya-api-rest",
  "crates/honba-ya-async",
  "crates/honba-ya-backtest",
  "crates/honba-ya-cli",
  "crates/honba-ya-config",
  "crates/honba-ya-engine",
  "crates/honba-ya-persistence",
  "crates/honba-ya-sim",
  "crates/honba-ya-sweep",
  "crates/honba-ya-testing",
  "crates/honba-ya-ws",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/your-org/honba-ya"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rust_decimal = "1"
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono"] }
schemars = { version = "0.8", features = ["derive"] }
arrow = "53"
parquet = { version = "53", features = ["arrow"] }
toml = "0.8"
rand = "0.8"
tokio-stream = "0.1"
http-body-util = "0.1"

honba-ya-api          = { path = "crates/honba-ya-api" }
honba-ya-api-rest     = { path = "crates/honba-ya-api-rest" }
honba-ya-async        = { path = "crates/honba-ya-async" }
honba-ya-backtest     = { path = "crates/honba-ya-backtest" }
honba-ya-cli          = { path = "crates/honba-ya-cli" }
honba-ya-config       = { path = "crates/honba-ya-config" }
honba-ya-engine       = { path = "crates/honba-ya-engine" }
honba-ya-persistence  = { path = "crates/honba-ya-persistence" }
honba-ya-sim          = { path = "crates/honba-ya-sim" }
honba-ya-sweep        = { path = "crates/honba-ya-sweep" }
honba-ya-testing      = { path = "crates/honba-ya-testing" }
honba-ya-ws           = { path = "crates/honba-ya-ws" }

# Aliases
honba-api             = { package = "honba-ya-api", path = "crates/honba-ya-api" }
honba-api-rest        = { package = "honba-ya-api-rest", path = "crates/honba-ya-api-rest" }
honba-async           = { package = "honba-ya-async", path = "crates/honba-ya-async" }
honba-cli             = { package = "honba-ya-cli", path = "crates/honba-ya-cli" }
honba-config          = { package = "honba-ya-config", path = "crates/honba-ya-config" }
honba-engine          = { package = "honba-ya-engine", path = "crates/honba-ya-engine" }
honba-sim             = { package = "honba-ya-sim", path = "crates/honba-ya-sim" }
honba-sweep           = { package = "honba-ya-sweep", path = "crates/honba-ya-sweep" }
honba-testing         = { package = "honba-ya-testing", path = "crates/honba-ya-testing" }

# Cross-repo dependencies
honba-kokoro-types     = { path = "../honba-kokoro/crates/honba-kokoro-types" }
honba-kokoro-messages  = { path = "../honba-kokoro/crates/honba-kokoro-messages" }
honba-kokoro-entities  = { path = "../honba-kokoro/crates/honba-kokoro-entities" }
honba-kokoro-ports     = { path = "../honba-kokoro/crates/honba-kokoro-ports" }
honba-kokoro-risk      = { path = "../honba-kokoro/crates/honba-kokoro-risk" }
honba-messages         = { package = "honba-kokoro-messages", path = "../honba-kokoro/crates/honba-kokoro-messages" }
honba-entities         = { package = "honba-kokoro-entities", path = "../honba-kokoro/crates/honba-kokoro-entities" }
honba-ports            = { package = "honba-kokoro-ports", path = "../honba-kokoro/crates/honba-kokoro-ports" }
honba-risk             = { package = "honba-kokoro-risk", path = "../honba-kokoro/crates/honba-kokoro-risk" }

honba-me-core          = { path = "../honba-me/crates/honba-me-core" }
honba-me-market        = { path = "../honba-me/crates/honba-me-market" }
honba-me-feed          = { path = "../honba-me/crates/honba-me-feed" }
honba-market           = { package = "honba-me-market", path = "../honba-me/crates/honba-me-market" }
honba-feed             = { package = "honba-me-feed", path = "../honba-me/crates/honba-me-feed" }

honba-nou-llm          = { path = "../honba-nou/crates/honba-nou-llm" }
honba-nou-analytics    = { path = "../honba-nou/crates/honba-nou-analytics" }
honba-nou-strategy     = { path = "../honba-nou/crates/honba-nou-strategy" }
honba-analytics        = { package = "honba-nou-analytics", path = "../honba-nou/crates/honba-nou-analytics" }
honba-strategy         = { package = "honba-nou-strategy", path = "../honba-nou/crates/honba-nou-strategy" }

honba-te-core          = { path = "../honba-te/crates/honba-te-core" }
honba-te-router        = { path = "../honba-te/crates/honba-te-router" }
