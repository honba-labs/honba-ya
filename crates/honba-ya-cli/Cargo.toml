[package]
name = "honba-ya-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for the Honba platform (docs/archive/plan.md E0-S7)"

[[bin]]
name = "honba"
path = "src/main.rs"

[dependencies]
clap                  = { workspace = true, features = ["derive", "env"] }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true, features = ["env-filter"] }
serde                 = { workspace = true, features = ["derive"] }
serde_json            = { workspace = true }
toml                  = { workspace = true }
anyhow                = { workspace = true }
chrono                = { workspace = true }
rust_decimal          = { workspace = true }
rust_decimal_macros   = { workspace = true }

# Workspace crates
honba-config.workspace = true
honba-ya-actors.workspace = true
honba-ya-backtest.workspace = true
honba-ya-api-rest.workspace = true
honba-ya-enhancer.workspace = true
honba-ya-persistence.workspace = true

# Cross-workspace crates
honba-api.workspace = true
honba-core.workspace = true
honba-mon.workspace = true
honba-portfolio.workspace = true
honba-me-market.workspace = true
honba-me-feed.workspace = true
honba-nou-analytics.workspace = true
honba-strategy.workspace = true
honba-tamashii-codegen.workspace = true

tokio                 = { version = "1", features = ["rt-multi-thread", "net", "signal"] }

[dev-dependencies]
arrow   = "53"
parquet = { version = "53", features = ["arrow"] }
