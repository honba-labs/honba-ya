[package]
name = "honba-ya-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "honba"
path = "src/main.rs"
doc = false

[dependencies]
# CLI + error handling
clap   = { version = "4", features = ["derive"] }
anyhow = "1"

# Config parsing (backtest.rs)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# Internal honba-ya crates
honba-engine          = { package = "honba-ya-engine", path = "../honba-ya-engine" }
honba-async           = { package = "honba-ya-async", path = "../honba-ya-async" }
honba-testing         = { package = "honba-ya-testing", path = "../honba-ya-testing" }
honba-sim             = { package = "honba-ya-sim", path = "../honba-ya-sim" }
honba-api-rest        = { package = "honba-ya-api-rest", path = "../honba-ya-api-rest" }
honba-config          = { package = "honba-ya-config", path = "../honba-ya-config" }

# Cross-workspace crates
honba-messages        = { package = "honba-kokoro-messages", path = "../../../honba-kokoro/crates/honba-kokoro-messages" }
honba-entities        = { package = "honba-kokoro-entities", path = "../../../honba-kokoro/crates/honba-kokoro-entities" }
honba-ports           = { package = "honba-kokoro-ports", path = "../../../honba-kokoro/crates/honba-kokoro-ports" }
honba-risk            = { package = "honba-kokoro-risk", path = "../../../honba-kokoro/crates/honba-kokoro-risk" }
honba-market          = { package = "honba-me-market", path = "../../../honba-me/crates/honba-me-market" }
honba-feed            = { package = "honba-me-feed", path = "../../../honba-me/crates/honba-me-feed" }
honba-analytics       = { package = "honba-nou-analytics", path = "../../../honba-nou/crates/honba-nou-analytics" }
honba-strategy        = { package = "honba-nou-strategy", path = "../../../honba-nou/crates/honba-nou-strategy" }
honba-codegen         = { package = "honba-tamashii-codegen", path = "../../../honba-tamashii/crates/honba-tamashii-codegen" }

tokio                 = { version = "1", features = ["rt-multi-thread", "net", "signal"] }

[dev-dependencies]
arrow   = "53"
parquet = { version = "53", features = ["arrow"] }
