[package]
name = "honba-ya-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "honba"
path = "src/main.rs"
doc = false

[dependencies]
# CLI + error handling
clap   = { version = "4", features = ["derive"] }
anyhow = "1"

# Config parsing (backtest.rs)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# Internal honba-ya crates
honba-ya-api-rest.workspace = true
honba-ya-config.workspace = true
honba-ya-testing.workspace = true
honba-ya-backtest.workspace = true

# Cross-workspace crates
honba-core.workspace = true
honba-mon.workspace = true
honba-portfolio.workspace = true
honba-me-market.workspace = true
honba-me-feed.workspace = true
honba-nou-analytics.workspace = true
honba-nou-strategy.workspace = true
honba-tamashii-codegen.workspace = true

tokio                 = { version = "1", features = ["rt-multi-thread", "net", "signal"] }

[dev-dependencies]
arrow   = "53"
parquet = { version = "53", features = ["arrow"] }
