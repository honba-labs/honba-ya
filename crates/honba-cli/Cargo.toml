[package]
name = "honba-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "honba"
path = "src/main.rs"
doc = false

[dependencies]
# CLI + error handling
clap   = { version = "4", features = ["derive"] }
anyhow = "1"

# Config parsing (backtest.rs)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"


# Workspace crates
honba-messages        = { path = "../honba-messages" }
honba-entities        = { path = "../honba-entities" }
honba-market          = { path = "../honba-market" }
honba-engine          = { path = "../honba-engine" }
honba-async           = { path = "../honba-async" }
honba-analytics       = { path = "../honba-analytics" }
honba-feed            = { path = "../honba-feed" }
honba-ports           = { path = "../honba-ports" }
honba-strategy        = { path = "../honba-strategy" }
honba-testing         = { path = "../honba-testing" }
honba-sim             = { path = "../honba-sim" }
honba-codegen         = { path = "../honba-codegen" }
honba-api-rest        = { path = "../honba-api-rest" }
honba-risk            = { path = "../honba-risk" }
honba-config          = { path = "../honba-config" }
tokio                 = { version = "1", features = ["rt-multi-thread", "net", "signal"] }

[dev-dependencies]
arrow   = "53"
parquet = { version = "53", features = ["arrow"] }
