[package]
name = "honba-strategies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Strategy optimization and enhancement tools for Honba platform"

[dependencies]
honba-core = { path = "../../honba-core" }
honba-mon = { path = "../../honba-mon" }
honba-ya-actors = { path = "../../honba-ya-actors" }
honba-ya-backtest = { path = "../../honba-ya-backtest" }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
rand = "0.8"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1"